# cargo-deny: what Tern's dependencies may be. Run `dev/audit.sh` (or `cargo deny check`).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# RustSec advisories. Vulnerabilities always fail; "unmaintained" only fails for crates Tern
# depends on directly (deep ones, like zbus under the keyring, are reported by cargo audit).
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
# Tern is GPL-3.0-or-later: everything here can be combined with it. GPL-2.0-only can't, so
# it's left out (self_cell is "Apache-2.0 OR GPL-2.0-only" and is used under Apache-2.0).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate is common in a GTK/tokio tree; report it, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
